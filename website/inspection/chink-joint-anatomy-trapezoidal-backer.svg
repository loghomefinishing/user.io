<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Inter, 'Source Sans 3', Arial, sans-serif" font-size="15"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b1d14"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7fd1"/></marker></defs><rect width="1000" height="600" fill="#fbf8f3"/><text x="500.0" y="40" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="700" font-size="22" fill="#5a3a1e">Anatomy of a properly built chink joint</text><text x="500.0" y="66" text-anchor="middle" fill="#6b5a48">Round-log wall in cross-section. Interior on the left, exterior on the right.</text><clipPath id="cud2"><rect x="130" y="80" width="460" height="230.0"/></clipPath><clipPath id="cld2"><rect x="130" y="310.0" width="460" height="250.0"/></clipPath><g clip-path="url(#cud2)"><circle cx="360" cy="170" r="150" fill="#dcbf93" stroke="#8a6a43" stroke-width="2"/><circle cx="360" cy="170" r="37.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="170" r="67.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="170" r="97.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="170" r="127.5" fill="none" stroke="#c9a676" stroke-width="1.2"/></g><g clip-path="url(#cld2)"><circle cx="360" cy="450" r="150" fill="#dcbf93" stroke="#8a6a43" stroke-width="2"/><circle cx="360" cy="450" r="37.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="450" r="67.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="450" r="97.5" fill="none" stroke="#c9a676" stroke-width="1.2"/><circle cx="360" cy="450" r="127.5" fill="none" stroke="#c9a676" stroke-width="1.2"/></g><rect x="312" y="306.0" width="96" height="8" fill="#3b3b3b" rx="2"/><polygon points="438.0,300.1 464.0,280.1 464.0,339.9 438.0,319.9" fill="#a3aeb8" stroke="#5f6b75" stroke-width="1.8"/><path d="M464 278.1 L484 254.4 Q476 310.0 484 365.6 L464 341.9 Z" fill="#f1ebe1" stroke="#9c8f7b" stroke-width="2"/><polygon points="282.0,300.1 256.0,280.1 256.0,339.9 282.0,319.9" fill="#a3aeb8" stroke="#5f6b75" stroke-width="1.8"/><path d="M256 278.1 L236 254.4 Q244 310.0 236 365.6 L256 341.9 Z" fill="#f1ebe1" stroke="#9c8f7b" stroke-width="2"/><circle cx="478.0" cy="254.4" r="11" fill="none" stroke="#3c6b2f" stroke-width="2.4" stroke-dasharray="4 3"/><circle cx="478.0" cy="365.6" r="11" fill="none" stroke="#3c6b2f" stroke-width="2.4" stroke-dasharray="4 3"/><line x1="480.0" y1="310.0" x2="640.0" y2="310.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="480.0" cy="310.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="315.0" text-anchor="start" font-weight="700" fill="#2b1d14">Chinking (e.g. Perma-Chink)</text><text x="646.0" y="333.0" text-anchor="start" font-weight="400" fill="#2b1d14">tooled to about 3/8 in. thick,</text><text x="646.0" y="351.0" text-anchor="start" font-weight="400" fill="#2b1d14">thinner in the middle so it can stretch</text><line x1="451.0" y1="322.0" x2="640.0" y2="405.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="451.0" cy="322.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="410.0" text-anchor="start" font-weight="700" fill="#2b1d14">Trapezoidal backer (e.g. Grip Strip)</text><text x="646.0" y="428.0" text-anchor="start" font-weight="400" fill="#2b1d14">wedges into the V, sets the depth, and is</text><text x="646.0" y="446.0" text-anchor="start" font-weight="400" fill="#2b1d14">a bond breaker: chinking does not stick to it</text><line x1="478.0" y1="246.4" x2="640.0" y2="135.0" stroke="#3c6b2f" stroke-width="1.1"/><circle cx="478.0" cy="246.4" r="2.8" fill="#3c6b2f"/><text x="646.0" y="140.0" text-anchor="start" font-weight="700" fill="#3c6b2f">Adhesion zone, upper log</text><text x="646.0" y="158.0" text-anchor="start" font-weight="400" fill="#3c6b2f">clean, bare, sound wood</text><line x1="478.0" y1="373.6" x2="640.0" y2="470.0" stroke="#3c6b2f" stroke-width="1.1"/><circle cx="478.0" cy="373.6" r="2.8" fill="#3c6b2f"/><text x="646.0" y="475.0" text-anchor="start" font-weight="700" fill="#3c6b2f">Adhesion zone, lower log</text><text x="646.0" y="493.0" text-anchor="start" font-weight="400" fill="#3c6b2f">two-sided bond lets the joint flex</text><line x1="330.0" y1="310.0" x2="30.0" y2="405.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="330.0" cy="310.0" r="2.8" fill="#2b1d14"/><text x="36.0" y="410.0" text-anchor="start" font-weight="700" fill="#2b1d14">Original gasket</text><text x="36.0" y="428.0" text-anchor="start" font-weight="400" fill="#2b1d14">bedding only,</text><text x="36.0" y="446.0" text-anchor="start" font-weight="400" fill="#2b1d14">not a seal</text><text x="160" y="570" font-style="italic" fill="#6b5a48">← interior</text><text x="560" y="570" text-anchor="end" font-style="italic" fill="#6b5a48">exterior →</text><text x="984" y="586" text-anchor="end" font-size="12" fill="#8a7a66">Schematic, not to scale. Follow the manufacturer's written instructions for each product. · Log Home Finishing LLC</text></svg>