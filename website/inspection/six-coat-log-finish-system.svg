<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, 'Source Sans 3', Arial, sans-serif" font-size="15"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b1d14"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7fd1"/></marker></defs><rect width="1000" height="520" fill="#fbf8f3"/><text x="500.0" y="40" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="700" font-size="22" fill="#5a3a1e">How a six-coat log finish protects the wood</text><text x="500.0" y="66" text-anchor="middle" fill="#6b5a48">Example: Perma-Chink Systems finish over freshly blasted and sanded logs</text><rect x="120" y="120" width="480" height="46" fill="#efe4cf" stroke="#8a6a43" stroke-width="1.2"/><line x1="120" y1="143.0" x2="600" y2="143.0" stroke="#8a6a43" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6"/><line x1="600.0" y1="143.0" x2="640.0" y2="139.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="600.0" cy="143.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="144.0" text-anchor="start" font-weight="700" fill="#2b1d14">Lifeline Advance clear top coat</text><text x="646.0" y="162.0" text-anchor="start" font-weight="400" fill="#2b1d14">2 coats: sheds water, protects the color</text><rect x="120" y="166" width="480" height="46" fill="#b07a45" stroke="#8a6a43" stroke-width="1.2"/><line x1="120" y1="189.0" x2="600" y2="189.0" stroke="#8a6a43" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6"/><line x1="600.0" y1="189.0" x2="640.0" y2="185.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="600.0" cy="189.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="190.0" text-anchor="start" font-weight="700" fill="#2b1d14">Lifeline Ultra-2 stain</text><text x="646.0" y="208.0" text-anchor="start" font-weight="400" fill="#2b1d14">2 coats: the pigment that blocks UV</text><rect x="120" y="212" width="480" height="46" fill="#e3c99c" stroke="#8a6a43" stroke-width="1.2"/><line x1="120" y1="235.0" x2="600" y2="235.0" stroke="#8a6a43" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.6"/><line x1="600.0" y1="235.0" x2="640.0" y2="231.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="600.0" cy="235.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="236.0" text-anchor="start" font-weight="700" fill="#2b1d14">Prelude primer</text><text x="646.0" y="254.0" text-anchor="start" font-weight="400" fill="#2b1d14">2 coats: even absorption and a strong bond</text><rect x="120" y="258" width="480" height="170" fill="#dcbf93" stroke="#8a6a43" stroke-width="1.5"/><path d="M120 280 C240 272 380 290 600 276" fill="none" stroke="#c9a676" stroke-width="1.4"/><path d="M120 306 C240 298 380 316 600 302" fill="none" stroke="#c9a676" stroke-width="1.4"/><path d="M120 332 C240 324 380 342 600 328" fill="none" stroke="#c9a676" stroke-width="1.4"/><path d="M120 358 C240 350 380 368 600 354" fill="none" stroke="#c9a676" stroke-width="1.4"/><path d="M120 384 C240 376 380 394 600 380" fill="none" stroke="#c9a676" stroke-width="1.4"/><path d="M120 410 C240 402 380 420 600 406" fill="none" stroke="#c9a676" stroke-width="1.4"/><line x1="600.0" y1="343.0" x2="640.0" y2="328.0" stroke="#2b1d14" stroke-width="1.1"/><circle cx="600.0" cy="343.0" r="2.8" fill="#2b1d14"/><text x="646.0" y="333.0" text-anchor="start" font-weight="700" fill="#2b1d14">Clean, sound bare wood</text><text x="646.0" y="351.0" text-anchor="start" font-weight="400" fill="#2b1d14">old finish and gray fiber removed</text><text x="646.0" y="369.0" text-anchor="start" font-weight="400" fill="#2b1d14">by media blasting and sanding</text><path d="M190 70 L190 110 Q194 118 216 92" fill="none" stroke="#2f7fd1" stroke-width="2.6" marker-end="url(#aw)"/><path d="M300 70 L300 110 Q304 118 326 92" fill="none" stroke="#2f7fd1" stroke-width="2.6" marker-end="url(#aw)"/><path d="M410 70 L410 110 Q414 118 436 92" fill="none" stroke="#2f7fd1" stroke-width="2.6" marker-end="url(#aw)"/><text x="160" y="96" text-anchor="end" font-size="13" font-weight="700" fill="#2f7fd1">liquid water sheds off</text><path d="M500 318 q8 -18 0 -36 q-8 -18 0 -36 q8 -18 0 -36 q-8 -18 0 -36 q8 -18 0 -36 q-8 -18 0 -36" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3 3"/><path d="M545 318 q8 -18 0 -36 q-8 -18 0 -36 q8 -18 0 -36 q-8 -18 0 -36 q8 -18 0 -36 q-8 -18 0 -36" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3 3"/><text x="130" y="408" font-size="13" fill="#6b5a48">Vapor inside the log can still escape (dashed), so the finish breathes.</text><text x="120" y="470" font-size="13" fill="#2b1d14">This only works when the joints and checks are sealed. Otherwise water gets in behind the finish and pushes it off.</text><text x="984" y="506" text-anchor="end" font-size="12" fill="#8a7a66">Layer thickness exaggerated for clarity · Log Home Finishing LLC</text></svg>